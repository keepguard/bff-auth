server:
  port: "8381"
  read_timeout: "120s"
  write_timeout: "120s"
  idle_timeout: "180s"

services:
  auth:
    base_url: "http://ms-auth:8081"
    timeout: "30s"
    retries: 3
  communication:
    base_url: "http://ms-communication:8082"
    timeout: "30s"
    retries: 3
  company:
    base_url: "http://ms-company:8083"
    timeout: "30s"
    retries: 3
  terms:
    base_url: "http://ms-terms:8084"
    timeout: "30s"
    retries: 3
  user:
    base_url: "http://ms-user:8085"
    timeout: "30s"
    retries: 3

rabbitmq:
  host: "rabbitmq"
  port: 5672
  user: "guest"
  password: "guest"
  vhost: "/"
  exchange: "ms-communication-exchange-dev"
  routing_key: "communication.message.send"
  durable: true
  auto_delete: false


jwt:
  issuer: "keepguard"
  audience: "keepguard-api"
  jwks_url: ""
  signing_key: ""

metrics:
  enabled: true
  scrape_path: "/metrics"
  port: "9092"

log:
  level: "info"
  format: "json"

env: "dev"
