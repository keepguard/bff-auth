server:
  port: "8381"
  read_timeout: "120s"
  write_timeout: "120s"
  idle_timeout: "180s"

services:
  auth:
    base_url: "http://ms-auth:8081"
    timeout: "30s"
    retries: 3
  communication:
    base_url: "http://ms-communication:8082"
    timeout: "30s"
    retries: 3
  company:
    base_url: "http://ms-company:8083"
    timeout: "30s"
    retries: 3
  terms:
    base_url: "http://ms-terms:8084"
    timeout: "30s"
    retries: 3
  user:
    base_url: "http://ms-user:8085"
    timeout: "30s"
    retries: 3

rabbitmq:
  host: "rabbit-1"
  port: 5672
  user: "keepguard"
  password: "keepguard123"
  vhost: "/"
  exchange: "ms-communication-exchange-prod"
  routing_key: "communication.message.send"
  durable: true
  auto_delete: false
  audit:
    enabled: true
    exchange: "srv-audit-exchange-prod"
    routing_key: "audit.event"
    durable: true


jwt:
  issuer: "keepguard"
  audience: "keepguard-api"
  jwks_url: ""
  signing_key: ""

redis:
  host: ${REDIS_HOST:redis}
  port: 6379
  password: ${REDIS_PASSWORD:}
  db: 0

rate_limit:
  enabled: true
  rules:
    login:
      limit: 5
      window: 60s
    forgot_password:
      limit: 3
      window: 300s
    device_challenge_send:
      limit: 3
      window: 300s
    device_challenge_verify:
      limit: 5
      window: 300s
    reset_password:
      limit: 5
      window: 600s
    change_password:
      limit: 5
      window: 60s
    refresh:
      limit: 30
      window: 60s
    validate:
      limit: 60
      window: 60s
    logout:
      limit: 20
      window: 60s
    device_quick_revoke:
      limit: 10
      window: 60s
    device_blacklist:
      limit: 10
      window: 60s
    account_lifecycle:
      limit: 5
      window: 60s
    default:
      limit: 60
      window: 60s

metrics:
  enabled: true
  scrape_path: "/metrics"
  port: "9092"

log:
  level: "warn"
  format: "json"

env: "prod"
