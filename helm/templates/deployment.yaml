apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-auth
  labels:
    app: bff-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff-auth
  template:
    metadata:
      labels:
        app: bff-auth
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: bff-auth
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED
          value: "false"
        - name: BFF_AUTH_ENV
          value: {{ .Values.env.bffAuthEnv | quote }}
        - name: BFF_AUTH_RABBITMQ_HOST
          value: {{ .Values.env.rabbitmqHost | quote }}
        - name: BFF_AUTH_REDIS_HOST
          value: "redis"
        - name: BFF_AUTH_SERVICES_COMPANY_BASE_URL
          value: {{ .Values.env.companyServiceUrl | quote }}
        - name: BFF_AUTH_SERVICES_USER_BASE_URL
          value: {{ .Values.env.userServiceUrl | quote }}
        - name: BFF_AUTH_SERVICES_AUTH_BASE_URL
          value: {{ .Values.env.authServiceUrl | quote }}
        - name: BFF_AUTH_SERVICES_COMMUNICATION_BASE_URL
          value: {{ .Values.env.communicationServiceUrl | quote }}
        - name: KEEPGUARD_VALIDATION_MODERATION_ENABLED
          value: "false"
        - name: BFF_AUTH_COOKIE_DOMAIN
          value: {{ .Values.env.cookieDomain | default ".keepguard.com.br" | quote }}
        - name: BFF_AUTH_COOKIE_SAMESITE
          value: {{ .Values.env.cookieSameSite | default "None" | quote }}
        - name: BFF_AUTH_COOKIE_SECURE
          value: {{ .Values.env.cookieSecure | default "true" | quote }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
        - name: metrics
          containerPort: {{ .Values.service.metricsPort }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.service.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
