apiVersion: v1
kind: Service
metadata:
  name: bff-auth-service
  labels:
    app: bff-auth
spec:
  selector:
    app: bff-auth
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
  - name: metrics
    port: {{ .Values.service.metricsPort }}
    targetPort: metrics
---
# Alias Docker Compose (hostname bff-auth) para probes e clients internos.
apiVersion: v1
kind: Service
metadata:
  name: bff-auth
  labels:
    app: bff-auth
spec:
  selector:
    app: bff-auth
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
  - name: metrics
    port: {{ .Values.service.metricsPort }}
    targetPort: metrics
