image:
  repository: ghcr.io/keepguard/bff-auth
  tag: "1.0.17"
  pullPolicy: IfNotPresent

service:
  port: 8381

resources:
  limits:
    memory: 256Mi
  requests:
    memory: 128Mi

env:
  bffAuthEnv: dev
  rabbitmqHost: "rabbitmq-service"
  companyServiceUrl: "http://ms-company:8083"
  userServiceUrl: "http://ms-user:8085"
  authServiceUrl: "http://ms-auth:8081"
  communicationServiceUrl: "http://ms-communication:8082"

imagePullSecrets:
  - name: ghcr-secret
